<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Modern</title>
    <style>
        /* Reset dan Base Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Card Login */
        .login-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 400px;
            transition: transform 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-5px);
        }

        .login-card h2 {
            text-align: center;
            color: #333;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .login-card p.subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        /* Form Group */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e5eb;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
            background: #f8f9fa;
        }

        .form-group input:focus {
            border-color: #667eea;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        /* Tombol Submit */
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-login:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Pesan Error/Success */
        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
            font-weight: 500;
        }
        .message.error { color: #e74c3c; }
        .message.success { color: #2ecc71; }

        /* Link Tambahan */
        .extra-links {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        .extra-links a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        .extra-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Selamat Datang</h2>
        <p class="subtitle">Silakan masuk ke akun Anda</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email / Username</label>
                <input type="text" id="email" placeholder="contoh@email.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Masukkan password" required>
            </div>
            
            <button type="submit" class="btn-login" id="btnSubmit">Masuk</button>
            
            <div class="message" id="message"></div>
        </form>

        <div class="extra-links">
            Lupa password? <a href="#">Klik di sini</a>
        </div>
    </div>

    <script>
        // Logika JavaScript untuk menangani form
        const form = document.getElementById('loginForm');
        const btnSubmit = document.getElementById('btnSubmit');
        const messageDiv = document.getElementById('message');

        form.addEventListener('submit', async function(event) {
            // Mencegah form melakukan reload halaman (default behavior)
            event.preventDefault(); 

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Tampilkan state loading
            btnSubmit.disabled = true;
            btnSubmit.textContent = 'Memproses...';
            messageDiv.textContent = '';
            messageDiv.className = 'message';

            // Simulasi pemanggilan API ke Backend (menggunakan setTimeout)
            // Di dunia nyata, ini akan diganti dengan fetch() ke server Anda
            setTimeout(() => {
                // Simulasi validasi sederhana
                if (email === 'admin@test.com' && password === 'password123') {
                    messageDiv.textContent = 'Login berhasil! Mengalihkan...';
                    messageDiv.classList.add('success');
                    
                    // Simulasi redirect setelah login sukses
                    // window.location.href = '/dashboard'; 
                } else {
                    messageDiv.textContent = 'Email atau password salah!';
                    messageDiv.classList.add('error');
                }

                // Kembalikan state tombol
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Masuk';
            }, 1500); // Simulasi delay jaringan 1.5 detik
        });
    </script>
</body>
</html>
